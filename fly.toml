# fly.toml app configuration file generated for factory-idvhpa on 2026-09-19T21:04:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'factory-idvhpa'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  # These remote authority locations are deployment topology, not secrets.
  AUTHBOUNDRY_URL = 'https://authboundry.fly.dev'
  FACTORY_ENVIRONMENT_ID = 'production'
  FACTORY_FELTDB_MODE = 'remote'
  FACTORY_NAMESPACE = 'software-factory'
  FACTORY_PORT = '3000'
  FACTORY_WORKSPACE_ROOT = '/tmp/software-factory'
  FELTDB_URL = 'https://feltdb.fly.dev'
  NODE_ENV = 'production'
  PAX_BIN = '/usr/local/bin/pax'

[processes]
  app = 'node dist/src/server.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
