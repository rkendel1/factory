name: factory-runner

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-factory-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PAX
        run: |
          PAX_ARCHIVE="$RUNNER_TEMP/pax-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rkendel1/pax/releases/download/build-295cacf/pax-x86_64-unknown-linux-gnu.tar.gz \
            --output "$PAX_ARCHIVE"
          echo "dc039e848c763215569823c9fed423ee03c1664a83543203a1f3880bb026f4eb  $PAX_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$PAX_ARCHIVE" -C "$RUNNER_TEMP" pax
          chmod 0755 "$RUNNER_TEMP/pax"
          "$RUNNER_TEMP/pax" --version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run runner tests
        run: npm test

      - name: Verify published FeltDB package boundary
        run: npm run test:external

      - name: Start runner and check health
        env:
          FACTORY_FELTDB_MODE: local
          FACTORY_PORT: 3111
          FACTORY_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          npm run build
          node dist/src/server.js &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT
          sleep 2
          curl --fail http://127.0.0.1:3111/health

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: software-factory-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy --config fly.toml --remote-only --strategy rolling
