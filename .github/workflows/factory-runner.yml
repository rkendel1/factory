name: factory-runner

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-factory-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PAX
        run: |
          PAX_ROOT="$RUNNER_TEMP/pax-install"
          cargo install \
            --git https://github.com/rkendel1/pax.git \
            --rev 6a53d3e86b767ea32a77c92bc3b388d8530eddd1 \
            --locked \
            --root "$PAX_ROOT"
          test "$("$PAX_ROOT/bin/pax" --version)" = "pax 0.2.0"
          echo "$PAX_ROOT/bin" >> "$GITHUB_PATH"

      - name: Run runner tests
        run: npm test

      - name: Verify published FeltDB package boundary
        run: npm run test:external

      - name: Start runner and check health
        env:
          FACTORY_FELTDB_MODE: local
          FACTORY_PORT: 3111
          FACTORY_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          npm run build
          node dist/src/server.js &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT
          sleep 2
          curl --fail http://127.0.0.1:3111/health

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: software-factory-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy --config fly.toml --remote-only --strategy rolling
